<style>
/* Layout: one column, phone-first. A week screen (story-style progress bar + seven day rows) and a day screen (frames stacked in posting order). */
:root {
  --bg: #f4f3f6;
  --surface: #ffffff;
  --sunk: #ecebf0;
  --ink: #1c1a22;
  --muted: #625c6d;
  --line: #e0dde6;
  --nad: #0f6b6b;  --nad-soft: #ddefee;
  --ber: #6b2a5c;  --ber-soft: #f2e3ee;
  --cre: #23356c;  --cre-soft: #e2e7f5;
  --life: #6d5f33; --life-soft: #f0ecdc;
  --done: #1f7a4d; --done-soft: #ddf1e6;
  --focus: #5b4bd6;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141218; --surface: #1e1b24; --sunk: #2a2631; --ink: #efedf3; --muted: #a9a2b6; --line: #34303c;
    --nad: #62c7c2; --nad-soft: #17322f; --ber: #da8dc7; --ber-soft: #35202e;
    --cre: #96aaea; --cre-soft: #1f2640; --life: #d6c38e; --life-soft: #302a1b;
    --done: #6fd19d; --done-soft: #183427; --focus: #a99cff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141218; --surface: #1e1b24; --sunk: #2a2631; --ink: #efedf3; --muted: #a9a2b6; --line: #34303c;
  --nad: #62c7c2; --nad-soft: #17322f; --ber: #da8dc7; --ber-soft: #35202e;
  --cre: #96aaea; --cre-soft: #1f2640; --life: #d6c38e; --life-soft: #302a1b;
  --done: #6fd19d; --done-soft: #183427; --focus: #a99cff; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(26px, 6vw, 34px); font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.nad { --c: var(--nad); --cs: var(--nad-soft); }
.ber { --c: var(--ber); --cs: var(--ber-soft); }
.cre { --c: var(--cre); --cs: var(--cre-soft); }
.life { --c: var(--life); --cs: var(--life-soft); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 3px 10px 3px 7px; border-radius: 999px; background: var(--cs); color: var(--c); white-space: nowrap; }
.chip i { width: 8px; height: 13px; border-radius: 2px; background: var(--c); }

/* week header */
.head { display: grid; gap: 10px; }
.bar { display: flex; gap: 4px; }
.bar span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.bar span.on { background: var(--ink); }
.weeks { display: flex; gap: 6px; flex-wrap: wrap; }
.wk { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; }
.wk[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.wk.locked { color: var(--muted); }

.banner { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; }
.banner.good { background: var(--done-soft); border-color: transparent; }
.banner .actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* day rows */
.days { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.row .dname { font-family: var(--display); font-weight: 700; font-size: 15px; }
.row .mid { display: grid; gap: 4px; min-width: 0; }
.row .seq { font-weight: 600; }
.row .meta { font-size: 13px; color: var(--muted); }
.row.next { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.row.posted { opacity: 0.7; }
.state { font-size: 13px; font-weight: 700; white-space: nowrap; }
.state.posted { color: var(--done); }
.state.next { color: var(--ink); }

.primary { background: var(--ink); color: var(--bg); border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; font-weight: 600; }
.link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-size: 14px; }

/* day screen */
.back { justify-self: start; }
.dayhead { display: grid; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
.dm { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.dm p { font-weight: 600; min-width: 0; }
.notes { display: grid; gap: 6px; font-size: 15px; }
.frame { display: grid; grid-template-columns: 72px 1fr; gap: 14px; align-items: start; }
.tile { aspect-ratio: 9 / 16; width: 72px; border-radius: 10px; background: var(--cs); border: 1.5px solid var(--c); display: grid; place-items: center; text-align: center; padding: 4px; }
.tile b { font-family: var(--display); font-size: 22px; color: var(--c); line-height: 1; }
.tile small { display: block; font-size: 10px; font-weight: 700; color: var(--c); margin-top: 4px; }
.fbody { display: grid; gap: 10px; min-width: 0; }
.fhead { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.who { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--sunk); color: var(--muted); }
.who.team { background: var(--done-soft); color: var(--done); }
.block { display: grid; gap: 6px; }
.blabel { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.blabel span { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.copy { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 10px; font-size: 13px; font-weight: 600; }
.copy.ok { color: var(--done); border-color: var(--done); }
.teamimg { width: 100%; max-width: 220px; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); background: var(--sunk); }
a.copy { color: var(--ink); text-decoration: none; justify-self: start; }
.say { font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.35; white-space: pre-line; }
.prompt { font-size: 14px; color: var(--muted); background: var(--sunk); border-radius: 10px; padding: 10px 12px; }
.sticker { font-size: 14px; }
.sticker b { font-weight: 700; }
.reviews { font-size: 14px; background: var(--sunk); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; }
.done { display: grid; gap: 12px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--done); flex: none; }
.nums { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.nums label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.nums input { font: 600 18px var(--body); padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font-variant-numeric: tabular-nums; width: 100%; }
.posted-btn { width: 100%; }
.posted-btn.is { background: var(--done); }

/* rules */
details.rules { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px; }
details.rules summary { font-weight: 700; padding: 12px 0; cursor: pointer; }
details.rules ul { margin: 0 0 14px; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; }
details.rules h3 { margin: 4px 0 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; }
</style>

const WEEKS = { 1: "Start simple", 2: "Tell your story", 3: "Answer questions", 4: "Repeat your winners" };
const PRODUCT = { nad: "NAD+", ber: "Berberine", cre: "Creatine", life: "Lifestyle" };
const DAYNAME = { Mon: "Monday", Tue: "Tuesday", Wed: "Wednesday", Thu: "Thursday", Fri: "Friday", Sat: "Saturday", Sun: "Sunday" };
const DM = { GLOW: "Reply GLOW and I'll send you exactly what I use.", LIGHTER: "Reply LIGHTER and I'll send you exactly what I use.", STRONG: "Reply STRONG and I'll send you exactly what I use." };
const UNLOCK_AT = 6;

const KEY = "health-story-hub:v1";
let state = { posted: {}, nums: {}, checks: {}, week: null, peek: {} };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const app = document.getElementById("app");
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
};

function weekDays(w) { return DAYS.filter(d => d.week === w); }
function postedCount(w) { return weekDays(w).filter(d => state.posted[d.id]).length; }
function currentWeek() {
  for (let w = 1; w <= 4; w++) if (postedCount(w) < UNLOCK_AT) return w;
  return 4;
}
function unlocked(w) { return w <= currentWeek() || state.peek[w]; }
function nextDay(w) { return weekDays(w).find(d => !state.posted[d.id]); }

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 1600);
}
function copyBtn(getText, label = "Copy") {
  const b = el("button", { class: "copy", type: "button", text: label });
  b.addEventListener("click", async () => {
    const text = getText();
    try { await navigator.clipboard.writeText(text); b.textContent = "Copied"; b.classList.add("ok"); toast("Copied"); }
    catch (e) {
      const ta = el("textarea", { style: "position:fixed;opacity:0" }); ta.value = text; document.body.append(ta); ta.select();
      try { document.execCommand("copy"); b.textContent = "Copied"; b.classList.add("ok"); } catch (_) { b.textContent = "Select and copy"; }
      ta.remove();
    }
    setTimeout(() => { b.textContent = label; b.classList.remove("ok"); }, 1800);
  });
  return b;
}
function chip(p) { return el("span", { class: "chip " + p }, el("i"), PRODUCT[p]); }
function shotLabel(s) { return s.replace("Lifestyle No Avatar", "Lifestyle, no avatar").replace("Avatar Only", "Avatar only").replace("Avatar + Product", "Avatar + product"); }

/* ---------- week screen ---------- */
function renderWeek(w) {
  state.week = w; save();
  app.replaceChildren();
  const days = weekDays(w);
  const done = postedCount(w);
  const nd = nextDay(w);

  app.append(el("div", { class: "head" },
    el("div", { class: "bar", "aria-label": `${done} of 7 posted this week` }, days.map(d => el("span", { class: state.posted[d.id] ? "on" : "" }))),
    el("p", { class: "eyebrow", text: `Health Story Hub · Week ${w} of 4` }),
    el("h1", { text: WEEKS[w] }),
    el("p", { class: "muted", text: done === 7 ? "All 7 stories posted this week." : `${done} of 7 posted. One story a day, in order.` }),
    el("div", { class: "weeks", role: "tablist", "aria-label": "Weeks" }, [1, 2, 3, 4].map(n => {
      const open = unlocked(n);
      return el("button", { class: "wk" + (open ? "" : " locked"), type: "button", role: "tab", "aria-current": String(n === w), onclick: () => {
        if (open) renderWeek(n); else lockedNote(n);
      } }, open ? `Week ${n}` : `Week ${n} 🔒`);
    }))
  ));

  if (done >= UNLOCK_AT && w < 4) {
    app.append(el("div", { class: "banner good" },
      el("h3", { text: done === 7 ? "Week done. Nice work." : "Almost there. Next week is open." }),
      el("p", { text: `Week ${w + 1} is ${WEEKS[w + 1].toLowerCase()}. Do your Sunday prep first: make next week's images in one sitting.` }),
      el("div", { class: "actions" }, el("button", { class: "primary", type: "button", text: `Go to week ${w + 1}`, onclick: () => renderWeek(w + 1) }))
    ));
  }

  if (nd) {
    app.append(el("button", { class: "primary", type: "button", onclick: () => renderDay(nd.id) }, `Start today's story: ${DAYNAME[nd.day]}, ${PRODUCT[nd.product]} ${nd.seq}`));
  }

  app.append(el("div", { class: "days" }, days.map(d => {
    const isPosted = !!state.posted[d.id];
    const isNext = nd && nd.id === d.id;
    return el("button", { class: "row" + (isPosted ? " posted" : "") + (isNext ? " next" : ""), type: "button", onclick: () => renderDay(d.id) },
      el("span", { class: "dname", text: d.day }),
      el("span", { class: "mid" },
        el("span", {}, chip(d.product)),
        el("span", { class: "seq", text: d.seq }),
        el("span", { class: "meta", text: d.frames.length ? `${d.frames.length} frames` + (d.keyword ? ` · keyword ${d.keyword}` : "") : "Pick and repeat" })
      ),
      el("span", { class: "state " + (isPosted ? "posted" : isNext ? "next" : ""), text: isPosted ? "Posted ✓" : isNext ? "Today" : "" })
    );
  })));

  app.append(rules());
  window.scrollTo(0, 0);
}

function lockedNote(n) {
  const prev = n - 1;
  app.querySelector(".banner.lock")?.remove();
  const b = el("div", { class: "banner lock" },
    el("h3", { text: `Week ${n} opens after week ${prev}` }),
    el("p", { text: `Post ${UNLOCK_AT} of 7 stories in week ${prev} first (${postedCount(prev)} so far). One week at a time keeps it simple.` }),
    el("div", { class: "actions" }, el("button", { class: "link", type: "button", text: `Open week ${n} anyway`, onclick: () => { state.peek[n] = true; save(); renderWeek(n); } }))
  );
  app.querySelector(".head").after(b);
}

/* ---------- day screen ---------- */
function renderDay(id) {
  const d = DAYS.find(x => x.id === id);
  app.replaceChildren();
  location.hash = id;

  app.append(el("button", { class: "ghost back", type: "button", text: `← Week ${d.week}`, onclick: () => { history.replaceState(null, "", location.pathname); renderWeek(d.week); } }));

  const head = el("div", { class: "dayhead" },
    el("p", { class: "eyebrow", text: `Week ${d.week} · ${DAYNAME[d.day]}` }),
    el("div", {}, chip(d.product)),
    el("h1", { text: d.seq }),
    d.goal ? el("p", { class: "muted", text: d.goal }) : null
  );
  app.append(head);

  const info = el("div", { class: "card" });
  if (d.keyword && DM[d.keyword]) {
    info.append(el("div", { class: "dm" }, el("p", { text: DM[d.keyword] }), copyBtn(() => DM[d.keyword], "Copy DM line")));
  }
  const notes = d.note.filter(Boolean);
  const general = ["Add the text and stickers inside Instagram, not on the image."];
  if (d.frames.some(f => /Link/.test(f.sticker))) general.push('Put a small "#ad" on every frame with a link sticker.');
  info.append(el("div", { class: "notes" }, [...notes, ...general].map(t => el("p", { text: t }))));
  app.append(info);

  let firstOfImage = {};
  d.frames.forEach((f, i) => {
    const n = i + 1;
    if (!f.reuse) firstOfImage[f.file] = n;
    const card = el("div", { class: "card frame " + d.product });
    card.append(el("div", { class: "tile" }, el("div", {}, el("b", { text: n }), el("small", { text: f.maker === "team" ? "TEAM" : "YOU" }))));
    const body = el("div", { class: "fbody" });
    body.append(el("div", { class: "fhead" },
      el("h3", { text: `Frame ${n}` }),
      f.shot ? el("span", { class: "muted", text: shotLabel(f.shot) }) : null,
      el("span", { class: "who" + (f.maker === "team" ? " team" : ""), text: f.maker === "team" ? "Team image" : "You make this" })
    ));
    if (f.reuse) {
      body.append(el("p", { class: "muted", text: `Same image as frame ${firstOfImage[f.file] || n - 1}. New text only.` }));
    } else if (f.maker === "team") {
      const src = `images/${d.id}-${f.file}`;
      const missing = el("p", { class: "muted", text: "Your coach hasn't added this image yet. Check back before you post." });
      const img = el("img", { class: "teamimg", src, alt: `Team image for frame ${n}`, loading: "lazy" });
      const save = el("a", { class: "copy", href: src, download: `${d.id}-frame${n}.jpg`, text: "Save image" });
      const wrapImg = el("div", { class: "block" }, img, save);
      wrapImg.hidden = true;
      img.addEventListener("load", () => { wrapImg.hidden = false; missing.hidden = true; });
      img.addEventListener("error", () => { wrapImg.hidden = true; missing.hidden = false; });
      body.append(wrapImg, missing);
    }
    if (f.text.length) {
      body.append(el("div", { class: "block" },
        el("div", { class: "blabel" }, el("span", { text: "Say on screen" }), copyBtn(() => f.text.join("\n"))),
        el("p", { class: "say", text: f.text.join("\n") })
      ));
    }
    if (f.sticker) body.append(el("p", { class: "sticker" }, el("b", { text: "Sticker: " }), f.sticker));
    if (f.reviews.length) body.append(el("div", { class: "reviews" }, el("b", { text: "Reviews to screenshot" }), f.reviews.map(r => el("p", { text: r[0].toUpperCase() + r.slice(1) }))));
    if (f.prompt) {
      body.append(el("div", { class: "block" },
        el("div", { class: "blabel" }, el("span", { text: f.maker === "team" ? "Image prompt (team)" : "Image prompt" }), copyBtn(() => f.prompt)),
        el("p", { class: "prompt", text: f.prompt })
      ));
    }
    card.append(body);
    app.append(card);
  });

  // after posting
  const done = el("div", { class: "card done" }, el("h2", { text: "After you post" }));
  d.after.forEach((a, i) => {
    const key = `${d.id}:${i}`;
    const cb = el("input", { type: "checkbox", id: "chk-" + key });
    cb.checked = !!state.checks[key];
    cb.addEventListener("change", () => { state.checks[key] = cb.checked; save(); });
    done.append(el("label", { class: "check", for: "chk-" + key }, cb, el("span", { text: a })));
  });
  const nums = state.nums[d.id] || {};
  const field = (k, label) => {
    const inp = el("input", { type: "number", inputmode: "numeric", min: "0", id: `${k}-${d.id}`, placeholder: "0" });
    if (nums[k] != null) inp.value = nums[k];
    inp.addEventListener("change", () => { state.nums[d.id] = Object.assign(state.nums[d.id] || {}, { [k]: inp.value === "" ? null : Number(inp.value) }); save(); });
    return el("label", { for: `${k}-${d.id}` }, label, inp);
  };
  if (d.frames.length) done.append(el("p", { class: "muted", text: "Tomorrow, write down how this story did. You'll use these in week 4." }));
  done.append(el("div", { class: "nums" }, field("replies", "Story replies"), field("taps", "Link taps")));
  const isPosted = !!state.posted[d.id];
  const btn = el("button", { class: "primary posted-btn" + (isPosted ? " is" : ""), type: "button", text: isPosted ? "Posted ✓ (tap to undo)" : "Mark as posted" });
  btn.addEventListener("click", () => {
    if (state.posted[d.id]) { delete state.posted[d.id]; save(); renderDay(d.id); return; }
    state.posted[d.id] = true; save();
    toast("Posted. See you tomorrow.");
    history.replaceState(null, "", location.pathname);
    renderWeek(d.week);
  });
  done.append(btn);
  app.append(done);

  if (d.id === "w4d6") app.append(bestList());
  window.scrollTo(0, 0);
}

function bestList() {
  const rows = DAYS.filter(x => x.week < 4 && state.nums[x.id] && (state.nums[x.id].replies || state.nums[x.id].taps))
    .map(x => ({ d: x, score: (state.nums[x.id].replies || 0) + (state.nums[x.id].taps || 0) }))
    .sort((a, b) => b.score - a.score).slice(0, 3);
  const c = el("div", { class: "card" }, el("h2", { text: "Your best days so far" }));
  if (!rows.length) c.append(el("p", { class: "muted", text: "Add your replies and taps on each day you post, and your top 3 show up here." }));
  rows.forEach(r => c.append(el("button", { class: "row", type: "button", onclick: () => renderDay(r.d.id) },
    el("span", { class: "dname", text: `W${r.d.week}` }),
    el("span", { class: "mid" }, el("span", {}, chip(r.d.product)), el("span", { class: "seq", text: `${r.d.day} · ${r.d.seq}` })),
    el("span", { class: "state", text: `${r.score}` }))));
  return c;
}

function rules() {
  return el("details", { class: "rules" },
    el("summary", { text: "Rules and keywords" }),
    el("h3", { text: "Keywords" }),
    el("ul", {}, ["NAD+ (dark teal bottle, capsules): GLOW", "Berberine (deep plum bottle, capsules, never gummies): LIGHTER", "Creatine (navy jar, gummies, 4 per serving): STRONG"].map(t => el("li", { text: t }))),
    el("h3", { text: "Never do this" }),
    el("ul", {}, [
      "Call berberine \"gummies\". Creatine is the gummy.",
      "Say \"not sponsored\" or \"not paid\". You earn from the link.",
      "Hide the \"AI-generated\" label on your profile.",
      "Promise results or use body-science lines like \"levels drop after 50\", \"burns fat\" or \"blood sugar\".",
      "Show weight loss, new muscles or fixed skin in before and after frames.",
      "Retype or edit a review. Screenshot the real one.",
      "Put two products in one story."
    ].map(t => el("li", { text: t }))),
    el("h3", { text: "Sunday prep" }),
    el("ul", {}, ["Make next week's avatar images in one sitting.", "Screenshot 2 or 3 fresh Amazon reviews per product.", "Only use a sale frame if the price really dropped that day.", "Save your keyword replies as Saved Replies in Instagram."].map(t => el("li", { text: t })))
  );
}

/* ---------- start ---------- */
const start = location.hash.slice(1);
if (DAYS.some(d => d.id === start)) renderDay(start);
else {
  const cw = currentWeek();
  renderWeek(state.week && unlocked(state.week) ? state.week : cw);
}
</script>
